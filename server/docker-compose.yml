# Local Postgres for development: `docker compose up -d` (from server/).
# The tables are created by `npm run drive:sync`, or by loading db/schema.sql.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: folk
      POSTGRES_PASSWORD: folk
      POSTGRES_DB: folkapp
    ports:
      - "5433:5432"
    volumes:
      - folkapp-postgres:/var/lib/postgresql/data

  # DB admin UI at http://localhost:5050 (login: admin@folkapp.dev / admin).
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@folkapp.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      - folkapp-pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

configs:
  pgadmin-servers:
    content: |
      {"Servers": {"1": {"Name": "folkapp", "Group": "Servers", "Host": "postgres",
        "Port": 5432, "MaintenanceDB": "folkapp", "Username": "folk", "SSLMode": "prefer"}}}

volumes:
  folkapp-postgres:
  folkapp-pgadmin:
