<div class="media-player d-flex flex-column" style="gap: 1rem;">
    <div>{{mediaController.selectedSong?.name || 'დასაკრავი სია ცარიელია'}}</div>
    <div class="footer-icon d-flex flex-row" style="gap: 1rem;">
        <mat-icon (click)="playOrPause()" style="flex-grow: 1;">{{ mediaController.isPlaying ? 'pause_arrow' : 'play_arrow' }}</mat-icon>
        <mat-icon (click)="changeRepeateType()">{{ repeatType }}</mat-icon>
    </div>
</div>
