<div class="media-player d-flex flex-column" style="gap: 1rem;" *ngIf="mediaController.isInitialized">
  <div class="d-flex flex-row" style="gap: 1rem;">
    <span style="flex-grow: 1;">
      {{ mediaController.selectedSong?.name || 'დასაკრავი სია ცარიელია' }}
    </span>
  </div>

  <div class="d-flex flex-column" style="gap: 1rem;">
    <div class="d-flex flex-row">
      <button class="action-button" [disabled]="!mediaController.isInitialized" (click)="playOrPause()">
      <mat-icon>{{ mediaController.isPlaying ? 'pause_arrow' : 'play_arrow' }}</mat-icon>
      </button>
      <button class="action-button" [disabled]="!mediaController.isInitialized">
        <mat-icon class="d-flex align-items-center" style="flex-grow: 1;" (click)="playPrevious()">skip_previous</mat-icon>
      </button>
      <button class="action-button" [disabled]="!mediaController.isInitialized">
        <mat-icon class="d-flex align-items-center" style="flex-grow: 1;" (click)="playNext()">skip_next</mat-icon>
      </button>
      <div style="flex-grow: 1;"></div>
      <button class="action-button" [disabled]="!mediaController.isInitialized" (click)="changeRepeatType()">
        <mat-icon>{{ repeatType }}</mat-icon>
      </button>
    </div>

    <div class="controls" style="margin: 0 1rem;">
      <input type="range"
            class="seek-bar"
            [value]="mediaController.positionUpdated$.value.currentPos"
            [max]="mediaController.positionUpdated$.value.maxPos"
            (input)="rewind($event)">
    </div>
  </div>
</div>
