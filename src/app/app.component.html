<div class="content" #divElement>
  <div class="d-flex flex-column" style="position: absolute; top: 10px; left: 10px">
    <span>Height: {{divElement.offsetHeight}}px</span>
    <span>Width: {{divElement.offsetWidth}}px</span>
  </div>
  <router-outlet></router-outlet>
</div>
<div class="player-container">
  <audio id="audio-element" [src]="mediaController.selectedSong?.path" autoplay controls style="display: none;">
  </audio>
</div>
