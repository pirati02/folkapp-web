<main class="main">
  <div class="content">
    <div class="left-side">
        <ul>
          <li *ngFor="let item of menu" >
            <a class="pill" [routerLink]="[item.link]">
              <span>{{ item.title }}</span>
            </a>
          </li>
        </ul>
    </div>
    <div class="divider" role="separator" aria-label="Divider"></div>
    <div class="right-side">
      <router-outlet></router-outlet>
    </div>
  </div>
</main>
