<main class="main">
  <div class="content">
    <router-outlet></router-outlet>
  </div>
  <div class="player-container">
    <audio [src]="mediaController.selectedSong?.path" autoplay controls style="display: none;">
      <source *ngFor="let song of mediaController.playList" [src]="song.path" type="audio/mpeg">
    </audio>
  </div>
</main>
