<div class="d-flex full-width full-height">
    <div class="artists-side">
        <ul class="list artist-list">
            <li *ngFor="let artist of artists"  class="list-item">
                <a (click)="selectArtist(artist)" class="pill" [ngClass]="{'selected-artist': artist.isSelected}"> 
                    <span>
                        {{ artist.name }}
                    </span>
                </a>
            </li>
        </ul>
    </div>
    
    <div class="artist-side" *ngIf="selectedArtist">
        <app-artist [artist]="selectedArtist"></app-artist>
    </div>
</div>
