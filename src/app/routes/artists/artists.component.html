<div class="header">ანსამბლები</div>
 

<div class="d-flex flex-column">
    <div class="d-flex full-width full-height">
        <div style="overflow: scroll; height: fit-content; width: 100%; height: calc(100vh / 1.3);">
            <mat-list class="list artist-list">
                <mat-list-item *ngFor="let artist of artists">
                    <div class="d-flex flex-column">
                        <a (click)="selectArtist(artist)" class="list-item" [ngClass]="{'selected-artist': artist.isSelected}">
                            <span style="margin: 0;">
                                {{ artist.name }}
                            </span>
                        </a>
                        <mat-divider></mat-divider>
                    </div>
                </mat-list-item>
            </mat-list>
        </div>
    </div>
</div>
 
<app-media-player>
</app-media-player>

<app-bottom-bar [items]="bottomBarItems"
                [selectedItem]="selectedBottomBarItem"
                (itemSelected)="navigate($event)">
</app-bottom-bar>
