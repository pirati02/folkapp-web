<div class="tab-list-footer-page">
  <div class="header d-flex">
    <button class="close-button" (click)="history.back()">
      <mat-icon>close</mat-icon>
    </button>
    <span class="header-title">
      ძიება
    </span>
  </div>

  <div class="search-input-container d-flex">
    <input #searchInput type="search" enterkeyhint="search" autocomplete="off"
           placeholder="მოძებნე სიმღერა ან მომღერალი"
           (input)="onInput(searchInput.value)" (keydown.enter)="onEnter()">
    <button class="clear-button" *ngIf="term" (click)="clearTerm()" aria-label="გასუფთავება">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="page-body">
    <!-- Nothing typed yet: recent searches -->
    <ng-container *ngIf="state.status === 'idle'">
      <div class="section" *ngIf="!term.trim() && recentSearches.length">
        <div class="section-title d-flex">
          <span>ბოლო ძიებები</span>
          <button class="text-button" (click)="clearRecent()">გასუფთავება</button>
        </div>
        <mat-list class="list">
          <mat-list-item *ngFor="let recent of recentSearches">
            <a class="list-item recent-item d-flex align-items-center" (click)="useRecent(recent)">
              <mat-icon>history</mat-icon>
              <span>{{ recent }}</span>
            </a>
          </mat-list-item>
        </mat-list>
      </div>
    </ng-container>

    <div class="loader d-flex align-items-center justify-content-center" *ngIf="state.status === 'loading'">
      <mat-spinner mode="indeterminate" diameter="40"></mat-spinner>
    </div>

    <h4 class="message" *ngIf="state.status === 'error'">ძიება ვერ მოხერხდა. სცადე თავიდან.</h4>
    <h4 class="message" *ngIf="isEmpty">ჩანაწერები ვერ მოიძებნა</h4>

    <ng-container *ngIf="result as result">
      <div class="section" *ngIf="result.artists.length">
        <div class="section-title">ანსამბლები</div>
        <mat-list class="list">
          <mat-list-item *ngFor="let artist of result.artists">
            <div class="d-flex flex-column">
              <a (click)="selectArtist(artist)" class="list-item artist-item">
                <ng-container *ngFor="let part of artist.name | highlight: term">
                  <mark *ngIf="part.match; else plain">{{ part.text }}</mark>
                  <ng-template #plain>{{ part.text }}</ng-template>
                </ng-container>
              </a>
              <mat-divider></mat-divider>
            </div>
          </mat-list-item>
        </mat-list>
      </div>

      <div class="section" *ngIf="result.songs.length">
        <div class="section-title">სიმღერები</div>
        <app-song-list [songs]="result.songs" [activeId]="mediaController.selectedSong?.id" [highlight]="term"
                       [showArtist]="true" (songSelected)="selectSong($event)"></app-song-list>
      </div>
    </ng-container>
  </div>
</div>
