<div class="tab-list-footer-page">
  <div class="header d-flex">
    <button class="close-button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
    <span class="header-title">
      {{ artist?.name }}
    </span>
  </div>

  <div class="page-body" *ngIf="!loading">
    <div class="sort-row d-flex" *ngIf="visibleSongs.length">
      <button class="chip" [class.is-on]="sort === 'name'" (click)="changeSort('name')">ა–ჰ</button>
      <button class="chip" [class.is-on]="sort === 'popular'" (click)="changeSort('popular')">პოპულარული</button>
      <button class="chip download-chip" *ngIf="offline.supported" (click)="downloadAll()">
        <mat-icon>download</mat-icon>{{ downloadLabel }}
      </button>
    </div>
    <app-song-list [songs]="visibleSongs" [activeId]="mediaController.selectedSong?.id"
                   (songSelected)="selectSong($event)"></app-song-list>
    <h4 class="empty-text" *ngIf="showEmptyListText">სია ცარიელია</h4>
  </div>

  <!-- Spinner row -->
  <div class="spinner-row d-flex justify-content-center align-items-center" *ngIf="loading">
    <mat-progress-spinner mode="indeterminate" color="accent" [strokeWidth]="7" [diameter]="40"></mat-progress-spinner>
  </div>
</div>
