<div class="mini-player" *ngIf="mediaController.selectedSong as song">
  <div class="progress" [style.width.%]="progress"></div>

  <button class="song" (click)="playerView.open('full')" aria-label="დამკვრელის გახსნა">
    <span class="cover" aria-hidden="true">{{ song.name.charAt(0) }}</span>
    <span class="text">
      <span class="title">{{ song.name }}</span>
      <span class="artist">{{ song.artistName }}</span>
    </span>
  </button>

  <button class="icon-button" (click)="mediaController.togglePlay()"
          [attr.aria-label]="mediaController.isPlaying ? 'პაუზა' : 'დაკვრა'">
    <mat-icon>{{ mediaController.isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
  </button>
  <button class="icon-button" (click)="mediaController.next()" aria-label="შემდეგი">
    <mat-icon>skip_next</mat-icon>
  </button>
  <button class="icon-button" [class.is-on]="playerView.view === 'queue'" (click)="playerView.toggle('queue')"
          aria-label="დასაკრავი სია" [attr.aria-expanded]="playerView.view === 'queue'">
    <mat-icon>queue_music</mat-icon>
  </button>
</div>
