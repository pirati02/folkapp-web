<mat-list class="list songs-list">
  <mat-list-item *ngFor="let song of songs; trackBy: trackById" [attr.id]="'song-' + song.id"
                 [class.has-artist]="showArtist">
    <div class="d-flex flex-column">
      <a (click)="songSelected.emit(song)" class="list-item song-item" [class.is-active]="song.id === activeId">
        <span class="song-name">
          <ng-container *ngFor="let part of song.name | highlight: highlight">
            <mark *ngIf="part.match; else plain">{{ part.text }}</mark>
            <ng-template #plain>{{ part.text }}</ng-template>
          </ng-container>
        </span>
        <span class="song-artist" *ngIf="showArtist">{{ song.artistName }}</span>
      </a>
      <mat-divider></mat-divider>
    </div>
  </mat-list-item>
</mat-list>
