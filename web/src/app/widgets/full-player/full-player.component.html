<div class="full-player" role="dialog" aria-label="დამკვრელი" *ngIf="mediaController.selectedSong as song">
  <div class="top">
    <button class="icon-button" (click)="close()" aria-label="დახურვა">
      <mat-icon>expand_more</mat-icon>
    </button>
    <span class="top-title">იკვრება</span>
    <button class="icon-button" (click)="playerView.open('queue')" aria-label="დასაკრავი სია">
      <mat-icon>queue_music</mat-icon>
    </button>
  </div>

  <div class="cover" aria-hidden="true"><span>{{ song.name.charAt(0) }}</span></div>

  <div class="meta">
    <div class="title">{{ song.name }}</div>
    <button class="artist" (click)="openArtist(song)">{{ song.artistName }}</button>
  </div>

  <div class="seek" *ngIf="mediaController.positionUpdated$ | async as position">
    <input type="range" min="0" step="1" [max]="position.maxPos" [value]="position.currentPos" (input)="seek($event)"
           aria-label="პოზიცია" [attr.aria-valuetext]="(position.currentPos | time) + ' / ' + (position.maxPos | time)">
    <div class="times">
      <span>{{ position.currentPos | time }}</span>
      <span>{{ position.maxPos | time }}</span>
    </div>
  </div>

  <div class="controls">
    <button class="icon-button" [class.is-on]="mediaController.shuffle" (click)="mediaController.toggleShuffle()"
            [attr.aria-pressed]="mediaController.shuffle" aria-label="არევა">
      <mat-icon>shuffle</mat-icon>
    </button>
    <button class="icon-button" (click)="mediaController.previous()" aria-label="წინა">
      <mat-icon>skip_previous</mat-icon>
    </button>
    <button class="play-button" (click)="mediaController.togglePlay()"
            [attr.aria-label]="mediaController.isPlaying ? 'პაუზა' : 'დაკვრა'">
      <mat-icon>{{ mediaController.isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
    </button>
    <button class="icon-button" (click)="mediaController.next()" aria-label="შემდეგი">
      <mat-icon>skip_next</mat-icon>
    </button>
    <button class="icon-button" [class.is-on]="mediaController.repeatType !== 'repeat'"
            (click)="mediaController.changeRepeatType()" [attr.aria-label]="repeatLabel" [title]="repeatLabel">
      <mat-icon>{{ mediaController.repeatType === 'repeat_one' ? 'repeat_one' : 'repeat' }}</mat-icon>
    </button>
  </div>

  <div class="actions">
    <button class="action" (click)="library.toggleFavorite(song)">
      <mat-icon>{{ library.isFavorite(song.id) ? 'favorite' : 'favorite_border' }}</mat-icon>
      <span>{{ library.isFavorite(song.id) ? 'რჩეულია' : 'რჩეული' }}</span>
    </button>
    <button class="action" *ngIf="offline.supported" (click)="toggleDownload(song)">
      <ng-container *ngIf="offline.active$ | async as active">
        <mat-icon>{{ offline.isDownloaded(song.id) ? 'download_done' : 'download' }}</mat-icon>
        <span *ngIf="(active[song.id] ?? -2) >= 0; else state">{{ active[song.id] * 100 | number: '1.0-0' }}%</span>
        <ng-template #state>
          <span>{{ offline.isDownloaded(song.id) ? 'გადმოწერილია' : (active[song.id] === -1 ? 'იწერება…' : 'გადმოწერა') }}</span>
        </ng-template>
      </ng-container>
    </button>
    <button class="action" [class.is-on]="mediaController.sleepTimer" (click)="sleepMenuOpen = !sleepMenuOpen"
            [attr.aria-expanded]="sleepMenuOpen">
      <mat-icon>bedtime</mat-icon>
      <span>{{ sleepLabel ?? 'ტაიმერი' }}</span>
    </button>
    <button class="action" (click)="share(song)">
      <mat-icon>share</mat-icon>
      <span>გაზიარება</span>
    </button>
  </div>

  <div class="sleep-menu" *ngIf="sleepMenuOpen" role="menu" aria-label="ძილის ტაიმერი">
    <div class="sleep-title">დაკვრის შეჩერება</div>
    <button role="menuitem" *ngFor="let choice of sleepChoices" (click)="setSleep(choice.value)">{{ choice.label }}</button>
    <button role="menuitem" *ngIf="mediaController.sleepTimer" (click)="setSleep()">ტაიმერის გამორთვა</button>
  </div>
</div>
