<div class="app-shell d-flex flex-column">
  <div class="offline-banner" *ngIf="!online" role="status">
    ინტერნეტი არ არის — ისმება გადმოწერილი სიმღერები
  </div>
  <div class="content">
    <router-outlet></router-outlet>
    <app-queue *ngIf="playerView.view === 'queue'" (closed)="playerView.close()"></app-queue>
  </div>
  <div class="player-container">
    <div class="notice" *ngIf="notice.message" role="status">{{ notice.message }}</div>
    <app-media-player></app-media-player>
    <app-bottom-bar></app-bottom-bar>
  </div>
</div>
<app-full-player *ngIf="playerView.view === 'full'"></app-full-player>
