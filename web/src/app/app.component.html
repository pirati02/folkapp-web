<div class="app-shell d-flex flex-column">
  <div class="offline-banner" *ngIf="!online" role="status">
    ინტერნეტი არ არის — ისმება გადმოწერილი სიმღერები
  </div>
  <div class="content">
    <router-outlet></router-outlet>
    <app-queue *ngIf="queueOpen" (closed)="queueOpen = false"></app-queue>
  </div>
  <div class="player-container">
    <app-media-player [queueOpen]="queueOpen" (queueToggled)="queueOpen = !queueOpen">
    </app-media-player>

    <app-bottom-bar>
    </app-bottom-bar>
  </div>
</div>
