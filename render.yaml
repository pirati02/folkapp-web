# Render Blueprint: the API (server/) and the web app (web/). Each redeploys only when its folder changes.
# Render > New > Blueprint > pick this repository. Values marked `sync: false` are asked for on creation.
# Names and region match the live services: the API is `folkapp-web` (folkapp-web.onrender.com, which
# web/src/environments/environment.ts calls) and the site is `folkapp-web-1` (folkapp-web-1.onrender.com).
services:
  - type: web
    name: folkapp-web
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://folkapp-web-1.onrender.com
      # The web app; shared song links open the song there.
      - key: WEB_BASE_URL
        value: https://folkapp-web-1.onrender.com
      - key: GDRIVE_AUDIO_FOLDER_ID
        sync: false
      - key: GDRIVE_IMAGE_FOLDER_ID
        sync: false
      # The whole service-account JSON key file, pasted as the value.
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false

  - type: web
    name: folkapp-web-1
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/folkapp-web/browser
    routes:
      # Angular routes (/artist/:id, /search, ...) are handled in the browser.
      - type: rewrite
        source: /*
        destination: /index.html
