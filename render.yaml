# Render Blueprint: the API (server/) and the web app (web/). Each redeploys only when its folder changes.
# Render > New > Blueprint > pick this repository. Values marked `sync: false` are asked for on creation.
services:
  - type: web
    name: folkapp-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: folkapp-api
      - key: CORS_ORIGINS
        value: https://folkapp-web.onrender.com
      - key: GDRIVE_AUDIO_FOLDER_ID
        sync: false
      - key: GDRIVE_IMAGE_FOLDER_ID
        sync: false
      # The whole service-account JSON key file, pasted as the value.
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false

  - type: web
    name: folkapp-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/folkapp-web/browser
    routes:
      # Angular routes (/artist/:id, /search, ...) are handled in the browser.
      - type: rewrite
        source: /*
        destination: /index.html
